name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: bash scripts/make-dmg.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
