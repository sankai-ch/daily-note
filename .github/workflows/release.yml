name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6
        run: |
          set -euo pipefail
          selected=""
          for app in /Applications/Xcode_16*.app /Applications/Xcode.app; do
            toolchain="$app/Contents/Developer"
            [ -x "$toolchain/usr/bin/swift" ] || continue
            version="$(DEVELOPER_DIR="$toolchain" "$toolchain/usr/bin/swift" --version 2>&1 || true)"
            case "$version" in
              *"Swift version 6"*)
                sudo xcode-select -s "$toolchain"
                selected="$app"
                break
                ;;
            esac
          done
          if [ -z "$selected" ]; then
            echo "::error::No Swift 6 toolchain. Installed: $(ls /Applications | grep -i xcode | tr '\n' ' ')"
            exit 1
          fi
          hash -r
          swift --version
          xcode-select -p
      - name: Build DMG
        run: bash scripts/make-dmg.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
