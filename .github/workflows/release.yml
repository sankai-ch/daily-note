name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - name: Build DMG
        run: |
          set +e
          echo "::notice::$(xcode-select -p) $(swift --version 2>&1 | tr '\n' ' ')"
          bash scripts/make-dmg.sh > build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            tail -n 20 build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$code"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
