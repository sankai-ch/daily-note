name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6
        run: |
          set -euo pipefail
          if ! swift --version 2>/dev/null | grep -q 'Swift version 6'; then
            selected=""
            for app in /Applications/Xcode*.app; do
              toolchain="$app/Contents/Developer"
              if [ -x "$toolchain/usr/bin/swift" ] && "$toolchain/usr/bin/swift" --version 2>/dev/null | grep -q 'Swift version 6'; then
                sudo xcode-select -s "$toolchain"
                selected="$app"
                break
              fi
            done
            if [ -z "$selected" ]; then
              echo "::error::No Swift 6 toolchain. Installed: $(ls /Applications | grep -i xcode | tr '\n' ' ')"
              swift --version || true
              exit 1
            fi
          fi
          swift --version
          xcode-select -p
      - name: Build DMG
        run: bash scripts/make-dmg.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
